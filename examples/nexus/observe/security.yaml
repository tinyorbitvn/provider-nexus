apiVersion: security.nexus.m.tinyorbit.vn/v1alpha1
kind: Realms
metadata:
  name: realms
  namespace: nexus
  annotations:
    crossplane.io/external-name: SECURITY_REALMS
spec:
  managementPolicies: ["Observe"]
  providerConfigRef: { name: default, kind: ProviderConfig }
  forProvider: {}
---
apiVersion: system.nexus.m.tinyorbit.vn/v1alpha1
kind: AnonymousAccess
metadata:
  name: anonymous
  namespace: nexus
  annotations:
    # system_anonymous_access has neither `id` nor `name` in its Terraform
    # schema (one object per server); its external-name class (singleton,
    # config/external_name.go) always normalizes to the constant "default"
    # on the first Observe regardless of what is set here.
    crossplane.io/external-name: default
spec:
  managementPolicies: ["Observe"]
  providerConfigRef: { name: default, kind: ProviderConfig }
  forProvider: {}
---
apiVersion: security.nexus.m.tinyorbit.vn/v1alpha1
kind: SsrfProtection
metadata:
  name: ssrf
  namespace: nexus
  annotations:
    # security_ssrf_protection is also a singleton (see AnonymousAccess
    # above): the external name always normalizes to "default".
    crossplane.io/external-name: default
spec:
  managementPolicies: ["Observe"]
  providerConfigRef: { name: default, kind: ProviderConfig }
  forProvider: {}
