apiVersion: nexus.m.tinyorbit.vn/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: nexus
spec:
  url: http://nexus.nexus.svc:8081          # out-of-cluster (make run + port-forward): http://127.0.0.1:8081
  username: admin
  credentials:
    source: Secret
    secretRef:
      name: nexus-admin
      namespace: nexus
      key: NEXUS_ADMIN_PASSWORD
