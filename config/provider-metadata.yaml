            enable_circular_redirects: (Boolean) Whether to enable redirects to the same location (may be required by some servers)
            enable_cookies: (Boolean) Whether to allow cookies to be stored and used
            enabled: (Boolean) Whether to cache responses for content not present in the proxied repository
            http_client: (Attributes) HTTP Client configuration for this Repository (see below for nested schema)
            key_pair: (String) PGP signing key pair (armored private key e.g. gpg --export-secret-key --armor)
            last_updated: (String) String representation of the date/time the resource was last changed
            metadata_max_age: (Number) How long to cache metadata before rechecking the remote repository (in minutes)
            name: (String) Name of the Repository
            negative_cache: (Attributes) Negative Cache configuration for this Repository (see below for nested schema)
            ntlm_domain: (String) NTLM Domain
            ntlm_host: (String) NTLM Host
            online: (Boolean) Whether this Repository is online and accepting incoming requests
            passphrase: (String, Sensitive) Passphrase to access PGP signing key
            password: (String, Sensitive) Password
            policy_names: (Set of String) Set of Cleanup Policies that will apply to this Repository
            preemptive: (Boolean) Whether to use pre-emptive authentication. Use with caution. Defaults to false.
            preemptive_pull_enabled: (Boolean) Whether pre-emptive pull is enabled
            proxy: (Attributes) Proxy specific configuration for this Repository (see below for nested schema)
            quarantine: (Boolean) Whether Quarantine functionallity is enabled (if false - just run in Audit mode) - see documentation.
            remote_url: (String) Location of the remote repository being proxied
            replication: (Attributes) Replication configuration for this Repository (see below for nested schema)
            repository_firewall: (Attributes) Sonatype Repository Firewall configuration for this Repository.
            retries: (Number) Total retries if the initial connection attempt suffers a timeout
            routing_rule: (String) Routing Rule
            storage: (Attributes) Storage configuration for this Repository (see below for nested schema)
            strict_content_type_validation: (Boolean) Whether this Repository validates that all content uploaded to this repository is of a MIME type appropriate for the repository format
            time_to_live: (Number) How long to cache the fact that a file was not found in the repository (in minutes)
            timeout: (Number) Seconds to wait for activity before stopping and retrying the connection
            type: (String) Authentication type
            url: (String) URL to access the Repository
            use_trust_store: (Boolean) Use certificates stored in the Nexus Repository Manager truststore to connect to external systems
            user_agent_suffix: (String) Custom fragment to append to User-Agent header in HTTP requests
            username: (String) Username
            yum: (Attributes) YUM specific configuration for this Repository (see below for nested schema)
        importStatements:
            - |-
              # Existing proxy yum repository configuration can be imported as follows.
              #
              # NOTE: The Identifier REPOSITORY_NAME needs to match repository name in your sonatype nexus repository instance.

              # Example
              terraform import sonatyperepo_repository_yum_proxy.example REPOSITORY_NAME
    sonatyperepo_role:
        subCategory: ""
        description: Manage Roles in Sonatype Nexus Repository
        name: sonatyperepo_role
        title: sonatyperepo_role Resource - sonatyperepo
        examples:
            - name: example
              manifest: |-
                {
                  "description": "Administrator role",
                  "id": "nx-admin",
                  "name": "nx-admin",
                  "privileges": [
                    "nx-all"
                  ]
                }
            - name: example
              manifest: |-
                {
                  "description": "Docker Roles",
                  "id": "docker-all",
                  "name": "docker-all",
                  "roles": [
                    "some-docker-role",
                    "some-other-docker-role"
                  ]
                }
        argumentDocs:
            description: (String) The description of this role.
            id: (String) The id of the Role.
            last_updated: (String) String representation of the date/time the resource was last changed
            name: (String) The name of the role.
            privileges: (Set of String) The set of privileges assigned to this role.
            roles: (Set of String) The set of roles assigned to this role.
        importStatements:
            - |-
              # Existing proxy docker repository configuration can be imported as follows.
              #
              # NOTE: The Identifier ROLE_NAME needs to match role name in your sonatype nexus repository instance.

              # Example
              terraform import sonatyperepo_role.role_name ROLE_NAME
    sonatyperepo_routing_rule:
        subCategory: ""
        description: Use this resource to create and manage routing rules in Sonatype Nexus Repository Manager
        name: sonatyperepo_routing_rule
        title: sonatyperepo_routing_rule Resource - sonatyperepo
        examples:
            - name: block_example
              manifest: |-
                {
                  "description": "Block requests matching example.com paths",
                  "matchers": [
                    "^/com/example/.*",
                    "^/org/example/.*"
                  ],
                  "mode": "BLOCK",
                  "name": "block-example-paths"
                }
            - name: allow_approved
              manifest: |-
                {
                  "description": "Allow only approved organization paths",
                  "matchers": [
                    "^/com/approved/.*",
                    "^/org/approved/.*",
                    "^/io/approved/.*"
                  ],
                  "mode": "ALLOW",
                  "name": "allow-approved-only"
                }
        argumentDocs:
            description: (String) Description of the routing rule (required by Nexus API)
            last_updated: (String) String representation of the date/time the resource was last changed
            matchers: (Set of String) Regular expressions used to identify request paths that are allowed or blocked (depending on mode)
            mode: '(String) Determines what should be done with requests when their path matches any of the matchers. Valid values: ALLOW, BLOCK'
            name: (String) Name of the routing rule
        importStatements:
            - |-
              # Existing routing rule configuration can be imported as follows.
              #
              # NOTE: The Identifier ROUTING_RULE_NAME needs to match routing rule name in your Sonatype Nexus Repository instance.

              # Example
              terraform import sonatyperepo_routing_rule.block_example ROUTING_RULE_NAME
    sonatyperepo_security_oauth2:
        subCategory: ""
        description: Configure Sonatype Nexus Repository OAuth2 / OpenID Connect (OIDC) authentication. Requires Nexus Repository Pro 3.94.0 or later, with nexus.security.oauth2.enabled=true and nexus.jwt.enabled=true set in nexus.properties. The underlying API does not exist on earlier versions - applying this resource against an older server fails with a clear error rather than a panic.
        name: sonatyperepo_security_oauth2
        title: sonatyperepo_security_oauth2 Resource - sonatyperepo
        examples:
            - name: oauth2_config
              manifest: |-
                {
                  "authorization_custom_params": {
                    "prompt": "consent"
                  },
                  "client_id": "nexus-repository-client",
                  "client_secret": "changeme",
                  "email_claim": "email",
                  "exact_match_claims": {
                    "aud": "nexus-repository-client"
                  },
                  "first_name_claim": "given_name",
                  "groups_claim": "groups",
                  "idp_authorization_url": "https://idp.example.com/oauth2/authorize",
                  "idp_jwks_url": "https://idp.example.com/oauth2/jwks",
                  "idp_jws_algorithm": "RS256",
                  "idp_logout_url": "https://idp.example.com/oauth2/logout",
                  "idp_token_url": "https://idp.example.com/oauth2/token",
                  "last_name_claim": "family_name",
                  "use_trust_store": false,
                  "username_claim": "preferred_username"
                }
        argumentDocs:
            authorization_custom_params: (Map of String) Additional custom parameters sent with the authorization request
            client_id: (String) Client ID issued by the OpenID Provider for this Nexus Repository instance
            client_secret: (String, Sensitive) Client Secret issued by the OpenID Provider. The API never returns this value on read, so Terraform cannot detect out-of-band changes to it.
            email_claim: (String) Claim containing the user's email address
            exact_match_claims: (Map of String) Claims that must exactly match the given value for authentication to succeed
            first_name_claim: (String) Claim containing the user's first name
            groups_claim: (String) Claim containing the user's group memberships, required for role mapping
            idp_authorization_url: (String) Authorization endpoint of the OpenID Provider
            idp_jwks: (String) Literal JSON Web Key Set (JWKS) document, as an alternative to idp_jwks_url
            idp_jwks_url: (String) JSON Web Key Set (JWKS) endpoint of the OpenID Provider
            idp_jws_algorithm: (String) JWT signature algorithm used to validate tokens issued by the OpenID Provider - e.g. RS256
            idp_logout_url: (String) Logout endpoint of the OpenID Provider
            idp_token_url: (String) Token endpoint of the OpenID Provider
            last_name_claim: (String) Claim containing the user's last name
            last_updated: (String) String representation of the date/time the resource was last changed
            token_request_custom_params: (Map of String) Additional custom parameters sent with the token request
            use_trust_store: (Boolean) Whether to validate the OpenID Provider's certificate using Nexus Repository's own truststore
            username_claim: (String) Claim used as the unique identifier for the user
        importStatements:
            - |-
              # Existing OAuth2/OIDC configuration can be imported as follows.
              #
              # NOTE: The Identifier (OAUTH2) in below example has no meaning and is just to comply with Terraform syntax.
              # NOTE: client_secret is never returned by the API, so it will not be populated after import -
              #       set it explicitly in configuration afterwards.

              # Example
              terraform import sonatyperepo_security_oauth2.oauth2_config OAUTH2
    sonatyperepo_security_realms:
        subCategory: ""
        description: Activate and order Sontaype Nexus Repository Security realms. This resource manages the configuration of active security realms and their order.
        name: sonatyperepo_security_realms
        title: sonatyperepo_security_realms Resource - sonatyperepo
        examples:
            - name: realms
              manifest: |-
                {
                  "active": [
                    "NexusAuthorizingRealm",
                    "DefaultRole"
                  ]
                }
        argumentDocs:
            active: (List of String) Specify active security realms in usage order. At least one realm must be specified.
            id: (String) Resource identifier
        importStatements:
            - |-
              # Existing Security Realms configuration can be imported as follows.
              #
              # NOTE: The Identifier (SECURITY_REALMS) in below example has no meaning and is just to comply with Terraform syntax.

              # Example
              terraform import sonatyperepo_security_realms.realms SECURITY_REALMS
    sonatyperepo_security_saml:
        subCategory: ""
        description: Configure Sonatype Nexus Repository Security SAML.
        name: sonatyperepo_security_saml
        title: sonatyperepo_security_saml Resource - sonatyperepo
        examples:
            - name: saml_config
              manifest: |-
                {
                  "email_attribute": "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress",
                  "first_name_attribute": "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname",
                  "groups_attribute": "http://schemas.xmlsoap.org/claims/Group",
                  "idp_metadata": "${file(\"/path/to/idp-metadata.xml\")}",
                  "last_name_attribute": "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname",
                  "username_attribute": "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier",
                  "validate_assertion_signature": true,
                  "validate_response_signature": true
                }
        argumentDocs:
            email_attribute: (String) IdP field mappings for user's email
            entity_id: (String) SAML Entity ID (typically a URI)
            first_name_attribute: (String) IdP field mappings for user's given name
            groups_attribute: (String) IdP field mappings for user's groups
            idp_metadata: (String) SAML Identity Provider Metadata XML
            last_name_attribute: (String) IdP field mappings for user's family name
            username_attribute: (String) IdP field mappings for username
            validate_assertion_signature: (Boolean) By default, if a signing key is found in the IdP metadata, then Sonatype Nexus Repository Manager will attempt to validate signatures on the assertions.
            validate_response_signature: (Boolean) Validate SAML response signature
        importStatements:
            - |-
              # Existing Security SAML configuration can be imported as follows.
              #
              # NOTE: The Identifier (SAML) in below example has no meaning and is just to comply with Terraform syntax.

              # Example
              terraform import sonatyperepo_security_saml.saml SAML
    sonatyperepo_security_ssl_truststore:
        subCategory: ""
        description: Manage SSL certificates in the Nexus truststore.
        name: sonatyperepo_security_ssl_truststore
        title: sonatyperepo_security_ssl_truststore Resource - sonatyperepo
        examples:
            - name: my_ca
              manifest: |-
                {
                  "pem": "${file(\"${path.module}/certs/MY_CA.pem\")}"
                }
        argumentDocs:
            expires_on: (Number) Certificate expires on (epoch milliseconds)
            fingerprint: (String) SHA-1 fingerprint of the certificate
            id: (String) Certificate ID
            issued_on: (Number) Certificate issued on (epoch milliseconds)
            issuer_common_name: (String) Issuer common name
            issuer_organization: (String) Issuer organization
            issuer_organizational_unit: (String) Issuer organizational unit
            last_updated: (String) String representation of the date/time the resource was last changed
            pem: (String) PEM-encoded certificate to add to the truststore
            serial_number: (String) Serial number of the certificate
            subject_common_name: (String) Subject common name
            subject_organization: (String) Subject organization
            subject_organizational_unit: (String) Subject organizational unit
        importStatements:
            - |-
              # Import an existing SSL certificate from the truststore by its ID.
              terraform import sonatyperepo_security_ssl_truststore.my_ca <certificate-id>
    sonatyperepo_security_ssrf_protection:
        subCategory: ""
        description: Manage SSRF (Server-Side Request Forgery) Protection settings. As of Sonatype Nexus Repository 3.92, requests to private (RFC1918) addresses are blocked unless explicitly allowed here.
        name: sonatyperepo_security_ssrf_protection
        title: sonatyperepo_security_ssrf_protection Resource - sonatyperepo
        examples:
            - name: ssrf
              manifest: |-
                {
                  "allowed_domains": [
                    "internal.example.com"
                  ],
                  "allowed_ips": [
                    "10.0.0.5"
                  ],
                  "enabled": true
                }
        argumentDocs:
            allowed_domains: (Set of String) Domain names allowed to bypass SSRF Protection
            allowed_ips: (Set of String) IP addresses allowed to bypass SSRF Protection
            enabled: (Boolean) Whether or not SSRF Protection is enabled
            last_updated: (String) String representation of the date/time the resource was last changed
        importStatements:
            - |-
              # Existing SSRF Protection configuraiton can be imported as follows.
              #
              # NOTE: The Identifier (SSRF_PROTECTION) in below example has no meaning and is just to comply with Terraform syntax.

              # Example
              terraform import sonatyperepo_security_ssrf_protection.ssrf SSRF_PROTECTION
    sonatyperepo_security_user_tokens Resource - sonatyperepo:
        subCategory: ""
        description: Manage User Token Configuration
        name: sonatyperepo_security_user_tokens Resource - sonatyperepo
        title: sonatyperepo_security_user_tokens Resource - sonatyperepo
        argumentDocs:
            enabled: (Boolean) Whether or not User Tokens feature is enabled
            expiration_days: (Number) Set user token expiration days (1-999)
            expiration_enabled: (Boolean) Enable user tokens expiration
            last_updated: (String) String representation of the date/time the resource was last changed
            protect_content: (Boolean) Additionally require user tokens for repository authentication
        importStatements: []
    sonatyperepo_system_anonymous_access:
        subCategory: ""
        description: Manage Anonymous Access
        name: sonatyperepo_system_anonymous_access
        title: sonatyperepo_system_anonymous_access Resource - sonatyperepo
        examples:
            - name: anonymous_access
              manifest: |-
                {
                  "enabled": true,
                  "realm_name": "NexusAuthorizingRealm",
                  "user_id": "anonymous"
                }
        argumentDocs:
            enabled: (Boolean) Whether or not Anonymous Access is enabled
            last_updated: (String) String representation of the date/time the resource was last changed
            realm_name: (String) The name of the authentication realm for the anonymous account
            user_id: (String) The username of the anonymous account
        importStatements:
            - |-
              # Existing Anonymous Access configuraiton can be imported as follows.
              #
              # NOTE: The Identifier (ANONYMOUS_ACCESS) in below example has no meaning and is just to comply with Terraform syntax.

              # Example
              terraform import sonatyperepo_system_anonymous_access.anonymous ANONYMOUS_ACCESS
    sonatyperepo_system_config_http:
        subCategory: ""
        description: Configure the System HTTP settings
        name: sonatyperepo_system_config_http
        title: sonatyperepo_system_config_http Resource - sonatyperepo
        examples:
            - name: http
              manifest: |-
                {
                  "http_proxy": {
                    "enabled": false
                  },
                  "https_proxy": {
                    "authentication": {
                      "enabled": true,
                      "password": "proxy-password",
                      "username": "proxy-user"
                    },
                    "enabled": true,
                    "host": "my.proxy.tld",
                    "port": 8080
                  }
                }
        argumentDocs:
            authentication: (Attributes) Proxy Authentication settings (see below for nested schema)
            enabled: (Boolean) Whether enabled
            host: (String) Proxy Server Hostname
            http_proxy: (Attributes) HTTP Proxy settings (see below for nested schema)
            https_proxy: (Attributes) HTTPS Proxy settings (see below for nested schema)
            last_updated: (String) String representation of the date/time the resource was last changed
            non_proxy_hosts: (Set of String) Hosts to exclude from HTTP/HTTPS Proxy
            ntlm_domain: (String) Proxy NTLM Domain
            ntlm_host: (String) Proxy NTLM Host
            password: (String, Sensitive) Proxy Password
            port: (Number) Proxy Server Port
            retries: (Number) Maximum number of retry attempts if the initial connection attempt suffers a timeout
            timeout: (Number) Time (seconds) to wait for activity before stopping and retrying the connection
            user_agent: (String) Custom fragment to append to “User-Agent” header in HTTP requests
            username: (String) Proxy Username
        importStatements:
            - |-
              # Existing System HTTP Configuration can be imported to state.
              #
              # NOTE: The Identifier (SECURITY_REALMS) in below example has no meaning and is just to comply with Terraform syntax.
              #
              # HTTP Proxy Passwords are not accessible via the REST API and will require a terrafom apply after terraform import to complete state.

              # Example
              terraform import sonatyperepo_system_config_http.config anything
    sonatyperepo_system_config_ldap_connection Resource - sonatyperepo:
        subCategory: ""
        description: 'Configure and manage an LDAP connection. WARNING: This does not work against Sonatype Nexus Repository 3.88.x - 3.89.0 due to a known bug in these versions.'
        name: sonatyperepo_system_config_ldap_connection Resource - sonatyperepo
        title: sonatyperepo_system_config_ldap_connection Resource - sonatyperepo
        argumentDocs:
            auth_password: (String, Sensitive) The password to bind with. Required if authScheme other than NONE.
            auth_realm: (String) The SASL realm to bind to. Required if authScheme is CRAM_MD5 or DIGEST_MD5.
            auth_scheme: (String) Authentication scheme used for connecting to LDAP server
            auth_username: (String) This must be a fully qualified username if simple authentication is used. Required if authScheme other than NONE.
            connection_retry_delay: (Number) How many seconds to wait before retrying
            connection_timeout: (Number) How many seconds to wait before timeout
            group_base_dn: (String) The relative DN where group objects are found (e.g. ou=Group). This value will have the Search base DN value appended to form the full Group search base DN. e.g. ou=Group
            group_id_attribute: (String) This field specifies the attribute of the Object class that defines the Group ID. Required if groupType is STATIC - e.g. cn
            group_member_attribute: (String) LDAP attribute containing the usernames for the group. Required if groupType is STATIC - e.g. memberUid
            group_member_format: (String) The format of user ID stored in the group member attribute. Required if groupType is STATIC - e.g. uid=${username},ou=people,dc=example,dc=com
            group_object_class: (String) LDAP class for group objects. Required if groupType is STATIC - e.g. posixGroup
            group_subtree: (Boolean) Are groups located in structures below the group base DN?
            group_type: '(String) Defines a type of groups used: static (a group contains a list of users) or dynamic (a user contains a list of groups). Required if ldapGroupsAsRoles is true.'
            hostname: (String) LDAP server hostname
            id: (String) Internal LDAP server ID
            last_updated: (String) String representation of the date/time the resource was last changed
            map_ldap_groups_to_roles: (Boolean) Denotes whether LDAP assigned roles are used as Nexus Repository Manager roles
            max_connection_attempts: (Number) How many connection attempts before giving up
            name: (String) LDAP connection name
            nexus_trust_store_enabled: (Boolean) Whether to use certificates stored in Nexus Repository Manager's truststore
            order: (Number) Order number in which the server is being used when looking for a user - cannot be set during CREATE
            port: (Number) LDAP server port
            protocol: (String) LDAP protocol to use
            search_base: (String) LDAP location to be added to the connection URL
            user_base_dn: (String) The relative DN where user objects are found (e.g. ou=people). This value will have the Search base DN value appended to form the full User search base DN.
            user_email_name_attribute: (String) This is used to find an email address given the user ID - e.g. mail
            user_id_attribute: (String) This is used to find a user given its user ID - e.g. uid
            user_ldap_filter: (String) LDAP search filter to limit user search - e.g. (|(mail=@example.com)(uid=dom))
            user_member_of_attribute: (String) Set this to the attribute used to store the attribute which holds groups DN in the user object. Required if group_type is DYNAMIC
            user_object_class: (String) LDAP class for user objects - e.g. inetOrgPerson
            user_password_attribute: (String) If this field is blank the user will be authenticated against a bind with the LDAP server
            user_real_name_attribute: (String) This is used to find a real name given the user ID - e.g. cn
            user_subtree: (Boolean) Are users located in structures below the user base DN?
        importStatements: []
    sonatyperepo_system_config_mail:
        subCategory: ""
        description: Configure the System Email Server
        name: sonatyperepo_system_config_mail
        title: sonatyperepo_system_config_mail Resource - sonatyperepo
        examples:
            - name: mail_config
              manifest: |-
                {
                  "enabled": true,
                  "from_address": "nexus@example.com",
                  "host": "smtp.example.com",
                  "nexus_trust_store_enabled": false,
                  "password": "[REDACTED:password]",
                  "port": 587,
                  "ssl_on_connect_enabled": false,
                  "ssl_server_identity_check_enabled": true,
                  "start_tls_enabled": true,
                  "start_tls_required": false,
                  "subject_prefix": "[Nexus]",
                  "username": "nexus-user"
                }
        argumentDocs:
            enabled: (Boolean) Whether Email Server is enabled
            from_address: (String) From Address to use when sending emails
            host: (String) SMTP Server Hostname
            last_updated: (String) String representation of the date/time the resource was last changed
            nexus_trust_store_enabled: (Boolean) Use certificate connected to the Nexus Repository Truststore
            password: (String, Sensitive) Password to use for authentication with SMTP Server
            port: (Number) SMTP Server Port
            ssl_on_connect_enabled: (Boolean) Enable SSL/TLS encryption upon connection
            ssl_server_identity_check_enabled: (Boolean) Enable server identity check
            start_tls_enabled: (Boolean) Enable STARTTLS support for insecure connections
            start_tls_required: (Boolean) Require STARTTLS support
            subject_prefix: (String) A prefix to use in Subject Lines for emails that are sent
            username: (String) Username to use for authentication with SMTP Server
        importStatements:
            - |-
              # Existing System Mail configuration can be imported as follows.
              #
              # NOTE: The Identifier (CONFIG_MAIL) in below example has no meaning and is just to comply with Terraform syntax.

              # Example
              terraform import sonatyperepo_system_config_mail.config_mail CONFIG_MAIL
    sonatyperepo_system_config_product_license:
        subCategory: ""
        description: Configure and LDAP connection
        name: sonatyperepo_system_config_product_license
        title: sonatyperepo_system_config_product_license Resource - sonatyperepo
        examples:
            - name: license
              manifest: |-
                {
                  "license_data": "${filebase64(\"/path/to/sonatype.lic\")}"
                }
        argumentDocs:
            contact_company: (String) Licensed Company Name
            contact_email: (String) Licensed Company Contact Email
            contact_name: (String) Licensed Company Contact Name
            effective_date: (String) License effective date
            expiration_date: (String) License expiration date
            features: (String) Licensed features
            fingerprint: (String) License fingerprint
            last_updated: (String) String representation of the date/time the resource was last changed
            license_data: (String, Sensitive) Base64 encoded license data
            license_type: (String) License type
            licensed_users: (String) Licensed User count
            max_repo_components: (Number) Licensed Max Repo Components
            max_repo_requests: (Number) Licensed Max Repo Requests
        importStatements: []
    sonatyperepo_system_iq_connection Resource - sonatyperepo:
        subCategory: ""
        description: Configure the Sonatype IQ Server Connection
        name: sonatyperepo_system_iq_connection Resource - sonatyperepo
        title: sonatyperepo_system_iq_connection Resource - sonatyperepo
        argumentDocs:
            authentication_method: (String) Authentication method for Sonatype IQ Connection
            connection_timeout: (Number) Seconds to wait for activity before stopping and retrying the connection.
            enabled: (Boolean) Whether to use Sonatype Repository Firewall
            fail_open_mode_enabled: (Boolean) Allow by default when quarantine is enabled and the connection to Sonatype IQ Server fails
            last_updated: (String) String representation of the date/time the resource was last changed
            nexus_trust_store_enabled: (Boolean) Use certificates stored in the Nexus Repository Manager truststore to connect to Sonatype IQ Server
            password: (String, Sensitive) Credentials for the Sonatype Repository Firewall User
            properties: (String) Additional properties to configure for Sonatype Repository Firewall
            show_iq_server_link: (Boolean) Show Sonatype Repository Firewall link in Browse menu when server is enabled
            url: (String) The address of your Sonatype IQ Server
            username: (String) User with access to Sonatype Repository Firewall
        importStatements: []
    sonatyperepo_task_blobstore_compact:
        subCategory: ""
        description: Manage Task 'Admin - Compact blob store' (blobstore.compact)
        name: sonatyperepo_task_blobstore_compact
        title: sonatyperepo_task_blobstore_compact Resource - sonatyperepo
        examples:
            - name: task_bc
              manifest: |-
                {
                  "alert_email": "",
                  "enabled": true,
                  "frequency": {
                    "schedule": "manual"
                  },
                  "name": "test-blobstore-compact",
                  "notification_condition": "FAILURE",
