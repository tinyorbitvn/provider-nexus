    sonatyperepo_user:
        subCategory: ""
        description: Manage Local and non-Local Users
        name: sonatyperepo_user
        title: sonatyperepo_user Resource - sonatyperepo
        examples:
            - name: test_user
              manifest: |-
                {
                  "email_address": "test@local.user",
                  "first_name": "Testing",
                  "last_name": "User",
                  "password": "somethingSecurer",
                  "roles": [
                    "nx-anonymous"
                  ],
                  "status": "active",
                  "user_id": "test-local-user"
                }
            - name: saml_admin
              manifest: |-
                {
                  "email_address": "admin@somewhere.tld",
                  "first_name": "SAML",
                  "last_name": "Admin",
                  "roles": [
                    "nx-test-role"
                  ],
                  "status": "active",
                  "user_id": "admin"
                }
        argumentDocs:
            email_address: (String) The email address associated with the user.
            first_name: (String) The first name of the user.
            last_name: (String) The last name of the user.
            last_updated: (String) String representation of the date/time the resource was last changed
            password: (String, Sensitive) The password for the user.
            read_only: (Boolean) Whether the user is read-only
            roles: (Set of String) The list of roles assigned to this User.
            source: (String) Source system managing this user
            status: (String) The user's status.
            user_id: (String) The userid which is required for login. This value cannot be changed.
        importStatements:
            - |-
              # Import Local user
              terraform import sonatyperepo_user.saml_user my-uid,DEFAULT

              # Import LDAP user
              terraform import sonatyperepo_user.saml_user my-ldap-uid,LDAP

              # Import SAML user
              terraform import sonatyperepo_user.saml_admin my-user-id,SAML
