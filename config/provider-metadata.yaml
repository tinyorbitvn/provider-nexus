name: sonatype-nexus-community/sonatyperepo
resources:
    sonatyperepo_blob_store_acs:
        subCategory: ""
        description: Use this resource to manage an Azure Cloud Storage (ACS) Blob Store
        name: sonatyperepo_blob_store_acs
        title: sonatyperepo_blob_store_acs Resource - sonatyperepo
        examples:
            - name: blob_store
              manifest: |-
                {
                  "bucket_configuration": {
                    "account_name": "AZURE-STORAGE-ACCOUNT-NAME",
                    "authentication": {
                      "account_key": "YOUR-SECRET-ACCOUNT-KEY-HERE",
                      "authentication_method": "ACCOUNTKEY"
                    },
                    "container_name": "AZURE-CONTAINER-NAME"
                  },
                  "name": "my-acs-blobs-tore"
                }
        argumentDocs:
            account_key: (String, Sensitive) The account key
            account_name: (String) Account name found under Access keys for the storage account.
            authentication: (Attributes) Authentication to Azure for this Blob Store (see below for nested schema)
            authentication_method: (String) The type of Azure authentication to use.
            bucket_configuration: (Attributes) Bucket Configuration for this Blob Store (see below for nested schema)
            container_name: (String) The name of an existing container to be used for storage.
            last_updated: (String) String representation of the date/time the resource was last changed
            limit: (Number) Quota limit
            name: (String) Name of the Blob Store
            soft_quota: (Attributes) Soft Quota for this Blob Store (see below for nested schema)
            type: (String) Soft Quota type
        importStatements:
            - |-
              # Import an existing Azure Cloud Storage Blob Store into Terraform State.
              #
              # Not if authenticating using Account Key, this cannot be read and will show as a change after import.

              # Example
              terraform import sonatyperepo_blob_store_acs.blob_store BLOB_STORE_FILE_NAME
    sonatyperepo_blob_store_file:
        subCategory: ""
        description: Use this data source to get a specific File Blob Store by it's name
        name: sonatyperepo_blob_store_file
        title: sonatyperepo_blob_store_file Resource - sonatyperepo
        examples:
            - name: blob_store
              manifest: |-
                {
                  "name": "file-blob-store",
                  "path": "/mnt/nexus-storage"
                }
        argumentDocs:
            last_updated: (String) String representation of the date/time the resource was last changed
            limit: (Number) Quota limit
            name: (String) Name of the Blob Store
            path: (String) The Path on disk of this File Blob Store
            soft_quota: (Attributes) Soft Quota for this Blob Store (see below for nested schema)
            type: (String) Soft Quota type
        importStatements:
            - |-
              # Import an existing Blob Store File into Terraform State.

              # Example
              terraform import sonatyperepo_blob_store_file.my_file BLOB_STORE_FILE_NAME
    sonatyperepo_blob_store_gcs:
        subCategory: ""
        description: Use this resource to create a Google Cloud Storage Blob Store
        name: sonatyperepo_blob_store_gcs
        title: sonatyperepo_blob_store_gcs Resource - sonatyperepo
        examples:
            - name: blob_store
              manifest: |-
                {
                  "bucket_configuration": {
                    "authentication": {
                      "account_key": "ACCOUNT_KEY",
                      "authentication_method": "METHOD"
                    },
                    "bucket": {
                      "name": "bucket_name"
                    }
                  },
                  "name": "gcs-blob-store"
                }
        argumentDocs:
            account_key: (String, Sensitive) The credentials JSON file content
            authentication: (Block, Optional) Authentication Configuration for Google Cloud Storage (see below for nested schema)
            authentication_method: (String) The type of Google Cloud authentication to use
            bucket: (Block, Optional) Main Bucket Configuration for this Blob Store (see below for nested schema)
            bucket_configuration: (Block, Optional) Bucket Configuration for this Google Cloud Storage Blob Store (see below for nested schema)
            encryption: (Block, Optional) Encryption Configuration for Google Cloud Storage (see below for nested schema)
            encryption_key: (String) CryptoKey ID for KMS encryption
            encryption_type: (String) The type of GCP server side encryption to use
            last_updated: (String) String representation of the date/time the resource was last changed
            limit: (Number) Quota limit in bytes
            name: (String) Name of the Blob Store
            prefix: (String) The path within your Cloud Storage bucket where blob data should be stored
            project_id: (String) The Google Cloud project id for the bucket
            region: (String) The Google Cloud region for the bucket
            soft_quota: (Block, Optional) Soft Quota for this Blob Store (see below for nested schema)
            type: (String) Type of this Blob Store - will always be 'gc_storage'
        importStatements: []
    sonatyperepo_blob_store_group:
        subCategory: ""
        description: Manage Blob Store Groups. This resource does not support promoting a Blob Store to becoming a Group - see examples.
        name: sonatyperepo_blob_store_group
        title: sonatyperepo_blob_store_group Resource - sonatyperepo
        examples:
            - name: example_group
              manifest: |-
                {
                  "fill_policy": "roundRobin",
                  "members": [
                    "test1",
                    "test2"
                  ],
                  "name": "example-group"
                }
            - name: example_group
              manifest: |-
                {
                  "fill_policy": "writeToFirst",
                  "members": [
                    "${sonatyperepo_blob_store.test1.name}",
                    "${sonatyperepo_blob_store.test2.name}"
                  ],
                  "name": "example-group"
                }
              references:
                members: sonatyperepo_blob_store.test1.name
        argumentDocs:
            fill_policy: (String) Fill Policy for this Blob Store - see official documentation.
            last_updated: (String) String representation of the date/time the resource was last changed
            limit: (Number) Quota limit
            members: (List of String) List of the names of blob stores that are members of this group
            name: (String) Name of the Blob Store
            soft_quota: (Attributes) Soft Quota for this Blob Store (see below for nested schema)
            type: (String) Soft Quota type
        importStatements:
            - |-
              # Import an existing Blob Store Group into Terraform State.

              # Example
              terraform import sonatyperepo_blob_store_group.my_group BLOB_STORE_GROUP_NAME
    sonatyperepo_blob_store_s3:
        subCategory: ""
        description: Use this resource to create a S3 Blob Store
        name: sonatyperepo_blob_store_s3
        title: sonatyperepo_blob_store_s3 Resource - sonatyperepo
        examples:
            - name: s3_blob_store
              manifest: |-
                {
                  "advanced_bucket_connection": {
                    "chunked_encoding": false,
                    "endpoint": "https://s3.us-east-1.amazonaws.com",
                    "path_style_access": false,
                    "signature_version": "AWSSIGV4"
                  },
                  "bucket_configuration": {
                    "bucket": "my-nexus-bucket",
                    "prefix": "nexus",
                    "region": "us-east-1"
                  },
                  "bucket_security": {
                    "access_key_id": "AKIAIOSFODNN7EXAMPLE",
                    "secret_access_key": "SECRET_EXAMPLE"
                  },
                  "encryption": {
                    "encryption_type": "s3"
                  },
                  "name": "s3-blob-store"
                }
        argumentDocs:
            access_key_id: (String, Sensitive) An IAM access key ID for granting access to the S3 bucket
            advanced_bucket_connection: (Attributes) Advanced Connection Configuration for this S3 Blob Store (see below for nested schema)
            bucket: (Attributes) Main Bucket Configuration for this Blob Store (see below for nested schema)
            bucket_configuration: (Attributes) Bucket Configuration for this Blob Store (see below for nested schema)
            bucket_security: (Attributes) Bucket Security Configuration for this Blob Store (see below for nested schema)
            encryption: (Attributes) Bucket Encryption Configuration for this Blob Store (see below for nested schema)
            encryption_key: (String, Sensitive) The encryption key
            encryption_type: (String) The type of S3 server side encryption to use
            endpoint: (String) A custom endpoint URL for third party object stores using the S3 API
            force_path_style: (Boolean) Setting this flag will result in path-style access being used for all requests
            last_updated: (String) String representation of the date/time the resource was last changed
            limit: (Number) Quota limit
            max_connection_pool_size: (Number) Setting this value will override the default connection pool size of Nexus of the s3 client for this blobstore
            name: (String) Name of the Blob Store
            pre_signed_url_enabled: (Boolean) Whether pre-signed URL is enabled or not. Requires Sonatype Nexus Repository Manager 3.79.0 PRO or later
            prefix: (String) The S3 blob store (i.e S3 object) key prefix
            region: (String) The AWS region to create a new S3 bucket in or an existing S3 bucket's region
            role: (String) An IAM role to assume in order to access the S3 bucket
            secret_access_key: (String, Sensitive) The secret access key associated with the specified IAM access key ID
            session_token: (String, Sensitive) An AWS STS session token associated with temporary security credentials which grant access to the S3 bucket
            signer_type: (String) An API signature version which may be required for third party object stores using the S3 API
            soft_quota: (Attributes) Soft Quota for this Blob Store (see below for nested schema)
            type: (String) Type of this Blob Store - will always be 's3'
        importStatements:
            - |-
              # Import an existing S3 Blob Store into Terraform State.

              # Example
              terraform import sonatyperepo_blob_store_s3.s3_bs BLOB_STORE_NAME

              # Note: API never returns the AWS Secret Access Key - so this will still show as a change requiring a `terraform apply` to be run
    sonatyperepo_capability_audit:
