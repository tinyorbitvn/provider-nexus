    sonatyperepo_repository_alpine_group:
        subCategory: ""
        description: Manage Group ALPINE Repositories.
        name: sonatyperepo_repository_alpine_group
        title: sonatyperepo_repository_alpine_group Resource - sonatyperepo
        examples:
            - name: alpine_group
              manifest: |-
                {
                  "alpine": {
                    "key_pair": "-----BEGIN RSA PRIVATE KEY-----\n...\n-----END RSA PRIVATE KEY-----",
                    "passphrase": "changeit"
                  },
                  "group": {
                    "member_names": [
                      "alpine-proxy-repo",
                      "alpine-hosted-repo"
                    ]
                  },
                  "name": "alpine-group-repo",
                  "online": true,
                  "storage": {
                    "blob_store_name": "default",
                    "strict_content_type_validation": false
                  }
                }
        argumentDocs:
            alpine: (Attributes) Alpine specific configuration for this Repository (see below for nested schema)
            blob_store_name: (String) Name of the Blob Store to use
            cleanup: (Attributes) Repository Cleanup configuration (see below for nested schema)
            group: (Attributes) Group specific configuration for this Repository (see below for nested schema)
            key_pair: (String) RSA private key in PEM format used to sign the repository index
            last_updated: (String) String representation of the date/time the resource was last changed
            member_names: (List of String) Member repositories' names
            name: (String) Name of the Repository
            online: (Boolean) Whether this Repository is online and accepting incoming requests
            passphrase: (String, Sensitive) Passphrase to access the RSA signing key
            policy_names: (Set of String) Set of Cleanup Policies that will apply to this Repository
            storage: (Attributes) Storage configuration for this Repository (see below for nested schema)
            strict_content_type_validation: (Boolean) Whether this Repository validates that all content uploaded to this repository is of a MIME type appropriate for the repository format
            url: (String) URL to access the Repository
        importStatements:
            - |-
              # Existing group alpine repository configuration can be imported as follows.
              #
              # NOTE: The Identifier REPOSITORY_NAME needs to match repository name in your sonatype nexus repository instance.

              # Example
              terraform import sonatyperepo_repository_alpine_group.example REPOSITORY_NAME
    sonatyperepo_repository_alpine_hosted:
        subCategory: ""
        description: Manage Hosted ALPINE Repositories.
        name: sonatyperepo_repository_alpine_hosted
        title: sonatyperepo_repository_alpine_hosted Resource - sonatyperepo
        examples:
            - name: alpine_hosted
              manifest: |-
                {
                  "alpine": {
