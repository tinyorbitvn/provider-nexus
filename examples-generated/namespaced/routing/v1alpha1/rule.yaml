apiVersion: routing.nexus.m.tinyorbit.vn/v1alpha1
kind: Rule
metadata:
  annotations:
    meta.upbound.io/example-id: routing/v1alpha1/rule
  labels:
    testing.upbound.io/example-name: block_example
  name: block-example
  namespace: crossplane-system
spec:
  forProvider:
    description: Block requests matching example.com paths
    matchers:
    - ^/com/example/.*
    - ^/org/example/.*
    mode: BLOCK
