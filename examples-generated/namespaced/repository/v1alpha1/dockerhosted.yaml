apiVersion: repository.nexus.m.tinyorbit.vn/v1alpha1
kind: DockerHosted
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/dockerhosted
  labels:
    testing.upbound.io/example-name: docker_hosted
  name: docker-hosted
  namespace: crossplane-system
spec:
  forProvider:
    docker:
      forceBasicAuth: true
      httpPort: 8082
      v1Enabled: false
    online: true
    storage:
      blobStoreName: default
      strictContentTypeValidation: true
      writePolicy: ALLOW
