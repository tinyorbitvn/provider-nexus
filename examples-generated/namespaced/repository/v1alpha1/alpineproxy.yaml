apiVersion: repository.nexus.m.tinyorbit.vn/v1alpha1
kind: AlpineProxy
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/alpineproxy
  labels:
    testing.upbound.io/example-name: alpine_proxy
  name: alpine-proxy
  namespace: crossplane-system
spec:
  forProvider:
    alpine:
      keyPair: |-
        -----BEGIN RSA PRIVATE KEY-----
        ...
        -----END RSA PRIVATE KEY-----
      passphraseSecretRef:
        key: example-key
        name: example-secret
    httpClient:
      autoBlock: false
      blocked: false
      connection:
        enableCircularRedirects: true
        enableCookies: true
        retries: 0
        timeout: 60
        useTrustStore: false
    negativeCache:
      enabled: true
      timeToLive: 1440
    online: true
    proxy:
      contentMaxAge: 1440
      metadataMaxAge: 1440
      remoteUrl: https://dl-cdn.alpinelinux.org/alpine/
    storage:
      blobStoreName: default
      strictContentTypeValidation: false
