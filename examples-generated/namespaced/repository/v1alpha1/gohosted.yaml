apiVersion: repository.nexus.m.tinyorbit.vn/v1alpha1
kind: GoHosted
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/gohosted
  labels:
    testing.upbound.io/example-name: go_hosted
  name: go-hosted
  namespace: crossplane-system
spec:
  forProvider:
    component:
      proprietaryComponents: false
    online: true
    storage:
      blobStoreName: default
      strictContentTypeValidation: false
      writePolicy: ALLOW
