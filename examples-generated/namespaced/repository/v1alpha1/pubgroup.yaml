apiVersion: repository.nexus.m.tinyorbit.vn/v1alpha1
kind: PubGroup
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/pubgroup
  labels:
    testing.upbound.io/example-name: pub_group
  name: pub-group
  namespace: crossplane-system
spec:
  forProvider:
    group:
      memberNames:
      - pub-proxy-repo
    online: true
    storage:
      blobStoreName: default
      strictContentTypeValidation: false
