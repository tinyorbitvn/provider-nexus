apiVersion: security.nexus.m.tinyorbit.vn/v1alpha1
kind: ServiceAccountToken
metadata:
  annotations:
    meta.upbound.io/example-id: security/v1alpha1/serviceaccounttoken
  labels:
    testing.upbound.io/example-name: ci
  name: ci
  namespace: crossplane-system
spec:
  forProvider:
    description: Used by the CI pipeline
    name: ci-pipeline
    roleId: ${sonatyperepo_role.ci.id}

---

apiVersion: security.nexus.m.tinyorbit.vn/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: security/v1alpha1/serviceaccounttoken
  labels:
    testing.upbound.io/example-name: ci
  name: ci
  namespace: crossplane-system
spec:
  forProvider:
    description: Deploys artifacts from CI
    name: ci-deployer
    privileges:
    - nx-repository-view-*-*-read
