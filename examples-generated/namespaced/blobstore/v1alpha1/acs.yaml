apiVersion: blobstore.nexus.m.tinyorbit.vn/v1alpha1
kind: Acs
metadata:
  annotations:
    meta.upbound.io/example-id: blobstore/v1alpha1/acs
  labels:
    testing.upbound.io/example-name: blob_store
  name: blob-store
  namespace: crossplane-system
spec:
  forProvider:
    bucketConfiguration:
      accountName: AZURE-STORAGE-ACCOUNT-NAME
      authentication:
        accountKeySecretRef:
          key: example-key
          name: example-secret
        authenticationMethod: ACCOUNTKEY
      containerName: AZURE-CONTAINER-NAME
