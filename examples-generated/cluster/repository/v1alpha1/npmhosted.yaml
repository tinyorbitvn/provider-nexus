apiVersion: repository.nexus.tinyorbit.vn/v1alpha1
kind: NpmHosted
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/npmhosted
  labels:
    testing.upbound.io/example-name: npm_hosted
  name: npm-hosted
spec:
  forProvider:
