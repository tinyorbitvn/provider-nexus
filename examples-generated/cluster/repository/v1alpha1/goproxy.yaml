apiVersion: repository.nexus.tinyorbit.vn/v1alpha1
kind: GoProxy
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/goproxy
  labels:
    testing.upbound.io/example-name: go_proxy
  name: go-proxy
spec:
  forProvider:
    httpClient:
      autoBlock: false
      blocked: false
      connection:
        enableCircularRedirects: true
        enableCookies: true
        retries: 0
        timeout: 60
        useTrustStore: false
    negativeCache:
      enabled: true
      timeToLive: 1440
    online: true
    proxy:
      contentMaxAge: 1440
      metadataMaxAge: 1440
      remoteUrl: https://proxy.golang.org
    storage:
      blobStoreName: default
      strictContentTypeValidation: false
