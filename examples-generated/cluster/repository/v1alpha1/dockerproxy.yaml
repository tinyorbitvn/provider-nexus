apiVersion: repository.nexus.tinyorbit.vn/v1alpha1
kind: DockerProxy
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/dockerproxy
  labels:
    testing.upbound.io/example-name: docker_proxy
  name: docker-proxy
spec:
  forProvider:
    docker:
      forceBasicAuth: false
      v1Enabled: false
    dockerProxy:
      indexType: REGISTRY
      indexUrl: https://index.docker.io
      use_nexus_ci: false
    httpClient:
      autoBlock: false
      blocked: false
      connection:
        enableCircularRedirects: true
        enableCookies: true
        retries: 0
        timeout: 60
        useTrustStore: false
    negativeCache:
      enabled: true
      timeToLive: 1440
    online: true
    proxy:
      contentMaxAge: 1440
      metadataMaxAge: 1440
      remoteUrl: https://registry-1.docker.io
    storage:
      blobStoreName: default
      strictContentTypeValidation: true
