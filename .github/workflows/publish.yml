name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vendor dependencies
        run: make vendor vendor.check

      - name: Build all platforms
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"

      # publish.artifacts only fires when BRANCH_NAME matches main|master|release-%;
      # on a tag checkout git reports HEAD, so name the branch explicitly.
      - name: Publish xpkg to ghcr.io
        run: make publish.artifacts BRANCH_NAME=main
        env:
          XPKG_REG_ORGS: ghcr.io/tinyorbitvn
          XPKG_REG_ORGS_NO_PROMOTE: ghcr.io/tinyorbitvn
